[project]
name = "docx-knowledge-graph"
version = "0.1.0"
description = "DOCX to JSON knowledge graphs with a FastAPI graph explorer and optional Astra chat"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
chat = [
  "langchain==1.4.0",
  "langchain-core==1.6.2",
  "langchain-openai==1.6.2",
  "langgraph==1.2.11",
  "openai==3.13.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
docx-knowledge-graph = "docx_knowledge_graph.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docx_knowledge_graph"]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.fastapi.static]
cdn = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".data", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
